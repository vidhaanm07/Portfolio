name: Apply futuristic portfolio intro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-intro:
    if: ${{ !contains(github.event.head_commit.message, 'Apply futuristic portfolio intro') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update intro
        run: python .github/update_intro.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply futuristic portfolio intro'
          git push

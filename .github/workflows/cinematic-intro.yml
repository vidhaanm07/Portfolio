name: Upgrade Cinematic Portfolio Intro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-intro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace intro
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          markup = '''<div id="portfolio-intro" aria-label="Portfolio initialization">
              <div class="intro-grid"></div><div class="intro-scan"></div>
              <div class="intro-orbit orbit-a"></div><div class="intro-orbit orbit-b"></div><div class="intro-core"></div>
              <div class="intro-status intro-status-left"><span>SYSTEM</span><b>INITIALIZING</b><span>AI</span><b>ONLINE</b><span>PROJECTS</span><b>LOADED</b></div>
              <div class="intro-status intro-status-right"><span>GITHUB</span><b>CONNECTED</b><span>NETWORK</span><b>SECURE</b><span>STATUS</span><b>READY</b></div>
              <div class="intro-content">
                  <div class="intro-kicker">PORTFOLIO SYSTEM / 2026</div>
                  <div class="intro-first" data-text="VIDHAAN">VIDHAAN</div>
                  <div class="intro-last" data-text="MATHUR">MATHUR</div>
                  <div class="intro-line"></div><div class="intro-meta">SOFTWARE · AI · ELECTRONICS</div>
                  <button class="intro-enter" id="intro-enter" type="button">ENTER PORTFOLIO <span>→</span></button>
              </div>
          </div>

          <!-- CURSOR + PROGRESS -->'''

          pattern = r'<div id="portfolio-intro".*?</div>\s*<!-- CURSOR \+ PROGRESS -->'
          text, n = re.subn(pattern, markup, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Existing intro markup was not found; stopping safely.')

          start_marker = '/* =========================\n   FUTURISTIC PORTFOLIO INTRO\n========================= */'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Existing intro CSS block was not found; stopping safely.')
          end = text.find('</style>', start)
          if end < 0:
              raise SystemExit('Could not locate CSS closing tag.')

          css = '''/* =========================
             CINEMATIC FUTURISTIC PORTFOLIO INTRO
          ========================= */
          #portfolio-intro{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#02040a;color:#fff;opacity:1;visibility:visible;transition:opacity .9s ease,visibility .9s ease;isolation:isolate}
          #portfolio-intro.hide{opacity:0;visibility:hidden;pointer-events:none}
          .intro-grid{position:absolute;inset:-25%;opacity:.48;background:linear-gradient(rgba(103,232,249,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.07) 1px,transparent 1px);background-size:44px 44px;transform:perspective(700px) rotateX(64deg) translateY(20%);transform-origin:center;animation:introGridMove 5s linear infinite}
          .intro-grid:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0 20%,rgba(2,4,10,.15) 48%,#02040a 78%)}
          .intro-scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(103,232,249,.05) 49%,rgba(103,232,249,.7) 50%,rgba(103,232,249,.04) 51%,transparent 100%);transform:translateY(-100%);animation:introScanDown 2.4s ease-in-out .25s infinite}
          .intro-orbit{position:absolute;width:min(72vw,720px);height:min(30vw,300px);min-width:320px;min-height:140px;border:1px solid rgba(103,232,249,.16);border-radius:50%;box-shadow:0 0 70px rgba(90,167,255,.06),inset 0 0 60px rgba(103,232,249,.025)}
          .orbit-a{transform:rotate(22deg);animation:introOrbitA 7s linear infinite}.orbit-b{transform:rotate(-28deg);border-color:rgba(167,139,250,.13);animation:introOrbitB 9s linear infinite}
          .intro-core{position:absolute;width:16px;height:16px;border-radius:50%;background:#75f6ff;box-shadow:0 0 18px #75f6ff,0 0 70px rgba(90,167,255,.8);animation:introCore 1.6s ease-in-out infinite}
          .intro-content{position:relative;z-index:5;text-align:center;font-family:"Space Grotesk",Inter,sans-serif;animation:introContent .9s cubic-bezier(.16,1,.3,1) both}
          .intro-kicker{margin-bottom:20px;font:9px "DM Mono",monospace;letter-spacing:.28em;color:rgba(117,246,255,.72);text-transform:uppercase;animation:introKicker 1s ease .2s both}
          .intro-first,.intro-last{position:relative;line-height:.86;font-weight:600;letter-spacing:.18em;margin-left:.18em}
          .intro-first{font-size:clamp(50px,8vw,110px);text-shadow:0 0 35px rgba(117,246,255,.12)}
          .intro-last{margin-top:13px;font-size:clamp(20px,3vw,38px);color:#75f6ff;text-shadow:0 0 25px rgba(117,246,255,.24)}
          .intro-first:after,.intro-last:after{content:attr(data-text);position:absolute;inset:0;color:#75f6ff;opacity:0;clip-path:inset(0 100% 0 0);animation:introGlitch 2.8s steps(2,end) .7s infinite}
          .intro-line{position:relative;width:clamp(110px,15vw,190px);height:1px;margin:28px auto 0;background:rgba(117,246,255,.16);overflow:hidden}
          .intro-line:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#75f6ff,transparent);transform:translateX(-100%);animation:introLine 1.1s ease .85s forwards}
          .intro-meta{margin-top:14px;font:9px "DM Mono",monospace;letter-spacing:.2em;color:rgba(135,147,167,.8)}
          .intro-enter{margin-top:30px;padding:11px 17px;border:1px solid rgba(117,246,255,.28);border-radius:8px;background:rgba(103,232,249,.035);color:#dffcff;font:10px "DM Mono",monospace;letter-spacing:.14em;cursor:pointer;transition:.25s ease;opacity:0;animation:introButton .7s ease 1.35s forwards}
          .intro-enter span{display:inline-block;margin-left:8px;transition:transform .25s ease}.intro-enter:hover{border-color:rgba(117,246,255,.65);background:rgba(103,232,249,.08);box-shadow:0 0 28px rgba(103,232,249,.12)}.intro-enter:hover span{transform:translateX(4px)}
          .intro-status{position:absolute;z-index:4;top:50%;width:145px;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;transform:translateY(-50%);font:8px "DM Mono",monospace;letter-spacing:.1em}
          .intro-status-left{left:5vw;text-align:left}.intro-status-right{right:5vw;text-align:right}.intro-status span{color:#51627a}.intro-status b{color:#75f6ff;font-weight:400}
          @keyframes introContent{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
          @keyframes introKicker{from{opacity:0;letter-spacing:.6em}to{opacity:1;letter-spacing:.28em}}
          @keyframes introGridMove{from{background-position:0 0}to{background-position:44px 44px}}
          @keyframes introScanDown{0%{transform:translateY(-100%)}55%,100%{transform:translateY(100%)}}
          @keyframes introOrbitA{from{transform:rotate(22deg) scale(.92)}50%{transform:rotate(202deg) scale(1.04)}to{transform:rotate(382deg) scale(.92)}}
          @keyframes introOrbitB{from{transform:rotate(-28deg) scale(1.03)}50%{transform:rotate(-208deg) scale(.92)}to{transform:rotate(-388deg) scale(1.03)}}
          @keyframes introCore{0%,100%{transform:scale(.7);opacity:.65}50%{transform:scale(1.4);opacity:1}}
          @keyframes introLine{to{transform:translateX(100%)}}
          @keyframes introButton{to{opacity:1}}
          @keyframes introGlitch{0%,78%,100%{opacity:0;clip-path:inset(0 100% 0 0);transform:translate(0)}80%{opacity:.8;clip-path:inset(15% 0 60% 0);transform:translate(-5px)}82%{opacity:.4;clip-path:inset(55% 0 15% 0);transform:translate(5px)}84%{opacity:0}}
          @media(max-width:700px){.intro-status{display:none}.intro-first{letter-spacing:.11em;margin-left:.11em}.intro-last{letter-spacing:.25em;margin-left:.25em}.intro-orbit{min-width:280px}}
          @media(prefers-reduced-motion:reduce){#portfolio-intro *{animation:none!important}}
          '''
          text = text[:start] + css + '\n' + text[end:]

          script = '''<script>
          (function(){const intro=document.getElementById("portfolio-intro"),enter=document.getElementById("intro-enter");if(!intro)return;let closed=false;function closeIntro(){if(closed)return;closed=true;intro.classList.add("hide");setTimeout(()=>intro.remove(),1000)}if(enter)enter.addEventListener("click",closeIntro);setTimeout(closeIntro,4200)})();
          </script>
          '''
          if 'id="intro-enter"' in text and 'function closeIntro()' not in text:
              text = text.replace('</body>', script + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit intro upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Upgrade portfolio opening animation"
          git push

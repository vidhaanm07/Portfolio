name: Upgrade Portfolio Intro

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '.github/workflows/upgrade-intro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-intro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade opening animation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          html = r'''<!-- VIDHAAN FUTURISTIC INTRO START -->
          <div id="portfolio-intro" aria-label="Vidhaan Mathur portfolio introduction">
            <div class="intro-grid"></div>
            <div class="intro-noise"></div>
            <div class="intro-scan"></div>
            <div class="intro-orbit orbit-a"></div>
            <div class="intro-orbit orbit-b"></div>
            <div class="intro-core"></div>
            <div class="intro-system">
              <span>SYS / 01</span><span>AI PORTFOLIO</span><span>2026</span>
            </div>
            <div class="intro-status">
              <div><span>AI</span><b>ONLINE</b></div>
              <div><span>PROJECTS</span><b>LOADED</b></div>
              <div><span>GITHUB</span><b>CONNECTED</b></div>
              <div><span>SYSTEM</span><b>READY</b></div>
            </div>
            <div class="intro-name">
              <div class="intro-first">VIDHAAN</div>
              <div class="intro-last">MATHUR</div>
              <div class="intro-role">SOFTWARE &nbsp;•&nbsp; AI &nbsp;•&nbsp; ELECTRONICS</div>
            </div>
            <div class="intro-enter">ENTER PORTFOLIO <span>→</span></div>
          </div>
          <!-- VIDHAAN FUTURISTIC INTRO END -->'''

          css = r'''/* VIDHAAN FUTURISTIC INTRO CSS START */
          #portfolio-intro{position:fixed;inset:0;z-index:99999;overflow:hidden;background:#02050a;color:#fff;display:flex;align-items:center;justify-content:center;isolation:isolate;opacity:1;visibility:visible;transition:opacity .9s ease,visibility .9s ease;font-family:Inter,sans-serif}
          #portfolio-intro.hide{opacity:0;visibility:hidden;pointer-events:none}
          .intro-grid{position:absolute;inset:-10%;background-image:linear-gradient(rgba(103,232,249,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.055) 1px,transparent 1px);background-size:54px 54px;transform:perspective(600px) rotateX(58deg) scale(1.4) translateY(18%);transform-origin:center bottom;animation:introGrid 3.8s ease-out both}
          .intro-noise{position:absolute;inset:0;opacity:.13;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}
          .intro-scan{position:absolute;left:0;right:0;top:-20%;height:1px;background:linear-gradient(90deg,transparent,rgba(103,232,249,.9),transparent);box-shadow:0 0 24px rgba(103,232,249,.8);animation:introScan 2.2s cubic-bezier(.4,0,.2,1) .25s forwards}
          .intro-orbit{position:absolute;border:1px solid rgba(103,232,249,.2);border-radius:50%;width:430px;height:150px;box-shadow:0 0 50px rgba(90,167,255,.08);animation:introOrbit 3s ease-out both}
          .orbit-a{transform:rotate(24deg) scale(.2);animation-delay:.25s}
          .orbit-b{width:540px;height:190px;border-color:rgba(167,139,250,.16);transform:rotate(-31deg) scale(.2);animation-delay:.42s}
          .intro-core{position:absolute;width:170px;height:170px;border-radius:50%;border:1px solid rgba(103,232,249,.3);background:radial-gradient(circle,rgba(103,232,249,.12),transparent 65%);box-shadow:0 0 90px rgba(90,167,255,.18);animation:introCore 1.5s ease-out both}
          .intro-system{position:absolute;top:32px;left:38px;right:38px;display:flex;justify-content:space-between;color:#58728f;font:10px 'DM Mono',monospace;letter-spacing:.14em;animation:introFade .8s .2s both}
          .intro-status{position:absolute;top:50%;left:50%;width:min(520px,78vw);display:flex;justify-content:space-between;gap:12px;transform:translate(-50%,-150px);color:#61758d;font:9px 'DM Mono',monospace;letter-spacing:.12em;animation:introFade .8s .5s both}
          .intro-status div{display:flex;flex-direction:column;gap:5px;text-align:center}
          .intro-status b{color:#79e6c1;font-weight:500}
          .intro-name{text-align:center;position:relative;z-index:3;animation:introName 1.2s .65s cubic-bezier(.2,.75,.2,1) both}
          .intro-first{font-family:'Space Grotesk',sans-serif;font-size:clamp(54px,9vw,118px);font-weight:600;letter-spacing:.18em;margin-left:.18em;line-height:.9;text-shadow:0 0 34px rgba(103,232,249,.14)}
          .intro-last{font-family:'Space Grotesk',sans-serif;margin-top:10px;font-size:clamp(22px,3.2vw,42px);font-weight:400;letter-spacing:.48em;margin-left:.48em;color:#70d6ff}
          .intro-role{margin-top:23px;font:10px 'DM Mono',monospace;letter-spacing:.22em;color:#7189a5}
          .intro-role:before{content:'';display:inline-block;width:34px;height:1px;background:#67e8f9;vertical-align:middle;margin-right:12px;opacity:.7}
          .intro-enter{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);font:10px 'DM Mono',monospace;letter-spacing:.18em;color:#9bb0c9;animation:introEnter .8s 1.55s both}
          .intro-enter span{color:#67e8f9;margin-left:8px}
          @keyframes introGrid{from{opacity:0;transform:perspective(600px) rotateX(58deg) scale(1.7) translateY(35%)}to{opacity:1;transform:perspective(600px) rotateX(58deg) scale(1.4) translateY(18%)}}
          @keyframes introScan{from{top:-20%;opacity:0}15%{opacity:1}to{top:120%;opacity:.15}}
          @keyframes introOrbit{from{opacity:0;transform:rotate(24deg) scale(.2)}to{opacity:1;transform:rotate(24deg) scale(1)}}
          @keyframes introCore{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}
          @keyframes introName{from{opacity:0;transform:translateY(22px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
          @keyframes introFade{from{opacity:0}to{opacity:1}}
          @keyframes introEnter{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
          @media(max-width:600px){.intro-system{left:18px;right:18px}.intro-status{width:88vw;transform:translate(-50%,-125px);font-size:8px}.intro-first{letter-spacing:.1em;margin-left:.1em}.intro-last{letter-spacing:.28em;margin-left:.28em}.intro-role{letter-spacing:.12em}.intro-orbit{width:330px;height:120px}.intro-core{width:130px;height:130px}}
          @media(prefers-reduced-motion:reduce){#portfolio-intro *{animation:none!important;transition:none!important}.intro-name,.intro-status,.intro-system,.intro-enter,.intro-core,.intro-orbit,.intro-grid{opacity:1}}
          /* VIDHAAN FUTURISTIC INTRO CSS END */'''

          js = r'''// VIDHAAN FUTURISTIC INTRO JS START
          (() => {
            const intro = document.getElementById('portfolio-intro');
            if (!intro) return;
            const close = () => intro.classList.add('hide');
            intro.addEventListener('click', close, { once: true });
            setTimeout(close, 3900);
          })();
          // VIDHAAN FUTURISTIC INTRO JS END'''

          # Replace existing intro HTML if present, otherwise insert after <body>.
          pattern = r'<!-- VIDHAAN FUTURISTIC INTRO START -->.*?<!-- VIDHAAN FUTURISTIC INTRO END -->'
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, html, s, count=1, flags=re.S)
          else:
              s = re.sub(r'<body([^>]*)>', r'<body\1>\n\n' + html, s, count=1, flags=re.I)

          # Replace/add CSS before </style>.
          css_pattern = r'/\* VIDHAAN FUTURISTIC INTRO CSS START \*/.*?/\* VIDHAAN FUTURISTIC INTRO CSS END \*/'
          if re.search(css_pattern, s, flags=re.S):
              s = re.sub(css_pattern, css, s, count=1, flags=re.S)
          else:
              s = s.replace('</style>', '\n' + css + '\n</style>', 1)

          # Replace/add JS before </body>.
          js_pattern = r'// VIDHAAN FUTURISTIC INTRO JS START.*?// VIDHAAN FUTURISTIC INTRO JS END'
          if re.search(js_pattern, s, flags=re.S):
              s = re.sub(js_pattern, js, s, count=1, flags=re.S)
          else:
              s = s.replace('</body>', '\n<script>\n' + js + '\n</script>\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('Futuristic intro upgraded successfully.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Create cinematic futuristic portfolio intro"
          git push
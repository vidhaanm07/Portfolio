name: Finalize Vidhaan Portfolio Intro

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-intro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace intro safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          cursor_marker = '<!-- CURSOR + PROGRESS -->'
          first_intro = s.find('<div id="portfolio-intro"')
          if first_intro == -1:
              first_intro = s.find("<div id='portfolio-intro'")
          if first_intro != -1 and cursor_marker in s:
              marker_pos = s.find(cursor_marker, first_intro)
              if marker_pos != -1:
                  s = s[:first_intro] + cursor_marker + s[marker_pos + len(cursor_marker):]

          s = re.sub(
              r'\s*<!-- VIDHAAN FUTURISTIC INTRO START -->.*?<!-- VIDHAAN FUTURISTIC INTRO END -->\s*',
              '\n', s, flags=re.S
          )

          def remove_intro_script(m):
              body = m.group(0)
              return '' if ('portfolio-intro' in body or 'intro-enter' in body or 'vidhaan-intro' in body) else body
          s = re.sub(r'<script\b[^>]*>.*?</script>', remove_intro_script, s, flags=re.S | re.I)

          html = r'''<!-- VIDHAAN INTRO V3 START -->
          <div id="vidhaan-intro" aria-label="Vidhaan Mathur portfolio introduction">
            <div class="vi-grid"></div>
            <div class="vi-vignette"></div>
            <div class="vi-scan"></div>
            <div class="vi-orbit vi-orbit-a"></div>
            <div class="vi-orbit vi-orbit-b"></div>
            <div class="vi-core"></div>
            <div class="vi-topbar"><span>VIDHAAN / PORTFOLIO</span><span>SYS-2026</span></div>
            <div class="vi-status vi-status-left"><span>AI</span><b>ONLINE</b><span>PROJECTS</span><b>LOADED</b></div>
            <div class="vi-status vi-status-right"><span>GITHUB</span><b>CONNECTED</b><span>SYSTEM</span><b>READY</b></div>
            <div class="vi-name">
              <div class="vi-kicker">INITIALIZING PORTFOLIO</div>
              <div class="vi-first">VIDHAAN</div>
              <div class="vi-last">MATHUR</div>
              <div class="vi-rule"></div>
              <div class="vi-role">SOFTWARE · AI · ELECTRONICS</div>
            </div>
            <button id="vi-enter" class="vi-enter" type="button"><span>ENTER PORTFOLIO</span><strong>→</strong></button>
            <div class="vi-progress"><span></span></div>
          </div>
          <!-- VIDHAAN INTRO V3 END -->

          <!-- CURSOR + PROGRESS -->'''

          if cursor_marker in s:
              s = s.replace(cursor_marker, html, 1)
          else:
              s = re.sub(r'<body([^>]*)>', r'<body\1>\n\n' + html, s, count=1, flags=re.I)

          css = r'''/* VIDHAAN INTRO V3 CSS START */
          #vidhaan-intro{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#02040a;color:#f7f9ff;isolation:isolate;opacity:1;visibility:visible;transition:opacity 1s ease,visibility 1s ease;font-family:Inter,sans-serif}
          #vidhaan-intro.vi-hide{opacity:0;visibility:hidden;pointer-events:none}
          #vidhaan-intro *{box-sizing:border-box}
          .vi-grid{position:absolute;inset:-35%;background-image:linear-gradient(rgba(103,232,249,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.065) 1px,transparent 1px);background-size:48px 48px;transform:perspective(700px) rotateX(63deg) translateY(24%);animation:viGrid 8s linear infinite;opacity:.65}
          .vi-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0 25%,rgba(2,4,10,.2) 52%,#02040a 88%)}
          .vi-scan{position:absolute;left:0;right:0;top:-10%;height:2px;background:linear-gradient(90deg,transparent,rgba(103,232,249,.9),transparent);box-shadow:0 0 25px rgba(103,232,249,.85);animation:viScan 5.5s cubic-bezier(.35,0,.2,1) .6s forwards}
          .vi-orbit{position:absolute;border:1px solid rgba(103,232,249,.16);border-radius:50%;width:min(68vw,760px);height:min(28vw,290px);min-width:300px;min-height:125px;box-shadow:0 0 80px rgba(90,167,255,.06);opacity:0;animation:viOrbit 1.8s cubic-bezier(.2,.8,.2,1) forwards}
          .vi-orbit-a{transform:rotate(24deg) scale(.72);animation-delay:1.15s}
          .vi-orbit-b{transform:rotate(-31deg) scale(.72);border-color:rgba(167,139,250,.13);animation-delay:1.35s}
          .vi-core{position:absolute;width:180px;height:180px;border-radius:50%;border:1px solid rgba(103,232,249,.22);background:radial-gradient(circle,rgba(103,232,249,.12),transparent 64%);box-shadow:0 0 90px rgba(90,167,255,.16),inset 0 0 50px rgba(103,232,249,.05);animation:viCore 2.2s ease-out 1.1s both}
          .vi-topbar{position:absolute;top:30px;left:38px;right:38px;display:flex;justify-content:space-between;color:#52677f;font:9px 'DM Mono',monospace;letter-spacing:.14em;animation:viFade 1s ease 1s both}
          .vi-status{position:absolute;top:50%;width:150px;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;transform:translateY(-50%);font:8px 'DM Mono',monospace;letter-spacing:.1em;animation:viFade 1s ease 2.1s both}
          .vi-status-left{left:4.5vw;text-align:left}.vi-status-right{right:4.5vw;text-align:right}.vi-status span{color:#51627a}.vi-status b{color:#75f6ff;font-weight:400}
          .vi-name{position:relative;z-index:4;text-align:center;margin-top:-12vh;animation:viName 1.4s cubic-bezier(.16,1,.3,1) 1.65s both}
          .vi-kicker{margin-bottom:22px;color:rgba(117,246,255,.7);font:9px 'DM Mono',monospace;letter-spacing:.3em;text-transform:uppercase}
          .vi-first{font:600 clamp(50px,8.5vw,116px)/.84 'Space Grotesk',sans-serif;letter-spacing:.18em;margin-left:.18em;text-shadow:0 0 38px rgba(103,232,249,.12)}
          .vi-last{margin-top:18px;color:#70e8f5;font:500 clamp(22px,3.3vw,42px)/1 'Space Grotesk',sans-serif;letter-spacing:.45em;margin-left:.45em;text-shadow:0 0 25px rgba(103,232,249,.18)}
          .vi-rule{width:160px;height:1px;margin:26px auto 0;background:linear-gradient(90deg,transparent,rgba(103,232,249,.75),transparent)}
          .vi-role{margin-top:13px;color:#71839b;font:9px 'DM Mono',monospace;letter-spacing:.2em}
          .vi-enter{position:absolute;z-index:8;left:50%;bottom:58px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 17px;border:1px solid rgba(103,232,249,.3);border-radius:8px;background:rgba(3,7,12,.72);backdrop-filter:blur(10px);color:#dffcff;font:10px 'DM Mono',monospace;letter-spacing:.15em;cursor:pointer;opacity:0;animation:viButton 1s ease 3.1s forwards;box-shadow:0 0 25px rgba(103,232,249,.04)}
          .vi-enter strong{color:#67e8f9;font-size:15px;font-weight:400;transition:transform .25s ease}.vi-enter:hover{border-color:rgba(103,232,249,.7);background:rgba(103,232,249,.07);box-shadow:0 0 30px rgba(103,232,249,.12)}.vi-enter:hover strong{transform:translateX(4px)}
          .vi-progress{position:absolute;left:50%;bottom:27px;transform:translateX(-50%);width:min(260px,55vw);height:1px;background:rgba(103,232,249,.12);overflow:hidden}.vi-progress span{display:block;width:100%;height:100%;background:linear-gradient(90deg,transparent,#67e8f9,transparent);transform:translateX(-100%);animation:viProgress 6.8s linear 1s forwards}
          @keyframes viGrid{to{background-position:48px 48px}}@keyframes viScan{0%{top:-10%;opacity:0}10%{opacity:1}100%{top:108%;opacity:.12}}@keyframes viOrbit{from{opacity:0;transform:rotate(24deg) scale(.72)}to{opacity:1;transform:rotate(24deg) scale(1)}}@keyframes viCore{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}@keyframes viFade{from{opacity:0}to{opacity:1}}@keyframes viName{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes viButton{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes viProgress{to{transform:translateX(100%)}}
          @media(max-width:700px){.vi-status{display:none}.vi-topbar{left:18px;right:18px}.vi-name{margin-top:-9vh}.vi-first{letter-spacing:.1em;margin-left:.1em}.vi-last{letter-spacing:.28em;margin-left:.28em}.vi-role{letter-spacing:.12em}.vi-orbit{min-width:280px}.vi-enter{bottom:52px}}
          @media(prefers-reduced-motion:reduce){#vidhaan-intro *{animation:none!important;transition:none!important}.vi-name,.vi-status,.vi-topbar,.vi-enter,.vi-core,.vi-orbit,.vi-grid{opacity:1}}
          /* VIDHAAN INTRO V3 CSS END */'''

          s = re.sub(r'/\* VIDHAAN INTRO V3 CSS START \*/.*?/\* VIDHAAN INTRO V3 CSS END \*/\s*', '', s, flags=re.S)
          s = s.replace('</style>', '\n' + css + '\n</style>', 1)

          js = r'''// VIDHAAN INTRO V3 JS START
          (() => {
            const intro = document.getElementById('vidhaan-intro');
            const enter = document.getElementById('vi-enter');
            if (!intro) return;
            let closed = false;
            const close = () => {
              if (closed) return;
              closed = true;
              intro.classList.add('vi-hide');
              window.setTimeout(() => intro.remove(), 1100);
            };
            if (enter) enter.addEventListener('click', close);
            window.setTimeout(close, 7600);
          })();
          // VIDHAAN INTRO V3 JS END'''
          s = re.sub(r'\s*// VIDHAAN INTRO V3 JS START.*?// VIDHAAN INTRO V3 JS END\s*', '\n', s, flags=re.S)
          s = s.replace('</body>', '\n<script>\n' + js + '\n</script>\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('Final intro applied safely.')

      - name: Validate HTML structure
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="vidhaan-intro"') == 1, 'Intro count is not exactly 1'
          assert s.count('id="vi-enter"') == 1, 'Enter button count is not exactly 1'
          assert s.count('VIDHAAN INTRO V3 START') == 1, 'Intro marker count is not exactly 1'
          assert 'setTimeout(close, 7600)' in s, 'Final intro timeout missing'
          assert 'bottom:58px' in s, 'Enter button positioning missing'
          print('Validation passed.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Finalize cinematic portfolio intro"
          git push

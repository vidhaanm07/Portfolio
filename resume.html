<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume | Vidhaan Mathur</title>
<style>
:root{--bg:#05070c;--panel:#0b1019;--line:rgba(255,255,255,.11);--text:#f5f7fb;--muted:#8b98aa;--blue:#65b7ff;--cyan:#75f6ff;--violet:#9b7cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-4;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;animation:grid 18s linear infinite}
body:after{content:"";position:fixed;width:420px;height:420px;left:-180px;top:10%;border-radius:50%;z-index:-3;background:radial-gradient(circle,rgba(101,183,255,.16),transparent 68%);filter:blur(15px);pointer-events:none}
@keyframes grid{to{background-position:48px 48px}} .wrap{width:min(1320px,88%);margin:auto}
.nav{margin-top:24px;position:sticky;top:18px;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border:1px solid var(--line);border-radius:18px;background:rgba(5,7,12,.78);backdrop-filter:blur(18px)}
.logo{font:700 20px "Space Grotesk",sans-serif;color:#fff;text-decoration:none}.logo b{color:var(--blue)}.back,.action{font:10px "DM Mono",monospace;color:#b9c6d8;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;transition:.25s}.back:hover,.action:hover{color:#fff;border-color:var(--blue);transform:translateY(-2px);box-shadow:0 0 25px rgba(101,183,255,.13)}
.hero{padding:75px 0 48px}.kicker{font:10px "DM Mono",monospace;letter-spacing:.2em;color:var(--blue)}h1{font:700 clamp(52px,8vw,112px)/.92 "Space Grotesk",sans-serif;letter-spacing:-.07em;margin:18px 0 25px}.lead{max-width:900px;color:var(--muted);font-size:19px}.tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.tag{font:10px "DM Mono",monospace;color:#b8c5d7;border:1px solid var(--line);padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.02)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:30px;border:1px solid var(--line);border-radius:20px;background:rgba(10,14,22,.72);backdrop-filter:blur(12px);transition:transform .18s,box-shadow .3s,border-color .3s}.card:hover{box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 30px rgba(101,183,255,.1);border-color:rgba(101,183,255,.4)}h2{font:600 29px "Space Grotesk",sans-serif;margin:0 0 16px}.card p,.card li{color:var(--muted)}.card ul{display:grid;gap:8px;padding-left:20px}.workflow{display:grid;gap:9px}.step{display:flex;gap:14px;padding:14px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.015);transition:.25s}.step:hover{transform:translateX(7px);border-color:rgba(117,246,255,.35);background:rgba(117,246,255,.035)}.num{font:10px "DM Mono";color:var(--cyan);min-width:25px}.reveal{opacity:0;transform:translateY(25px);transition:.8s cubic-bezier(.16,1,.3,1)}.show{opacity:1;transform:none}.progress{position:fixed;top:0;left:0;width:100%;height:2px;z-index:9999;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--blue),var(--cyan),var(--violet));box-shadow:0 0 14px var(--cyan)}footer{padding:65px 0 30px;color:#5d6878;font:9px "DM Mono"}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{width:92%}h1{font-size:57px}}
</style>
</head><body><div class="progress"></div><div class="wrap"><nav class="nav"><a class="logo" href="index.html">VIDHAAN<b>.</b></a><a class="back" href="index.html">← Portfolio</a></nav><main><section class="hero reveal"><div class="kicker">DOCUMENT / RESUME</div><h1>Resume</h1><p class="lead">Vidhaan Mathur — Software Engineering, AI and Electronics.</p><div style="margin-top:25px"><a class="action" href="Resume.pdf" target="_blank">Open Resume PDF ↗</a></div></section><section class="card reveal" style="min-height:70vh"><iframe src="Resume.pdf" title="Vidhaan Mathur Resume" style="width:100%;height:70vh;border:0;border-radius:12px;background:#fff"></iframe></section></main><footer>© 2026 VIDHAAN MATHUR · SOFTWARE × AI × ELECTRONICS</footer></div>
<script>
(()=>{const d=document;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.08});d.querySelectorAll('.reveal').forEach(e=>io.observe(e));const bar=d.querySelector('.progress');addEventListener('scroll',()=>{let m=d.documentElement.scrollHeight-innerHeight;bar.style.transform=`scaleX(${m?scrollY/m:0})`},{passive:true});if(!matchMedia('(prefers-reduced-motion:reduce)').matches)d.querySelectorAll('.card').forEach(c=>{c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateX(${-y*4}deg) rotateY(${x*6}deg) translateY(-5px)`});c.addEventListener('pointerleave',()=>c.style.transform='')});})();
</script>
</body></html>
